name: Deploy to AWS Lambda

# The workflow triggers only on push to main and staging branches
on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          # Determine the deployment environment based on the branch
          # Plain shell variables: values written to $GITHUB_ENV are only
          # visible from the next step on, not later in this one.
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_PREFIX=prod
            # Replace with your actual prod Lambda function name
            LAMBDA_NAME=habit-tracker-prod
          else
            ENV_PREFIX=staging
            # Replace with your actual staging Lambda function name
            LAMBDA_NAME=habit-tracker-dev
          fi

          # Generate the image tag (e.g., staging25 or prod26)
          {
            echo "ENV_PREFIX=$ENV_PREFIX"
            echo "LAMBDA_NAME=$LAMBDA_NAME"
            echo "IMAGE_TAG=${ENV_PREFIX}${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: habit-tracker-api # Your ECR repository name
        run: |
          # Full image URI
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "Building image: $IMAGE_URI"
          docker build --platform linux/amd64 -f Dockerfile.lambda -t $IMAGE_URI .
          
          echo "Pushing to AWS ECR..."
          docker push $IMAGE_URI
          
          # Save the URI for the next step
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          
      - name: Run Database Migrations
        env:
          POSTGRES_HOST: ${{ github.ref == 'refs/heads/main' && secrets.PROD_POSTGRES_HOST || secrets.STAGING_POSTGRES_HOST }}
          POSTGRES_USER: ${{ github.ref == 'refs/heads/main' && secrets.PROD_POSTGRES_USER || secrets.STAGING_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.PROD_POSTGRES_PASSWORD || secrets.STAGING_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ github.ref == 'refs/heads/main' && secrets.PROD_POSTGRES_DB || secrets.STAGING_POSTGRES_DB }}
          POSTGRES_PORT: "5432"
        run: |
          echo "Running Alembic migrations for $ENV_PREFIX environment..."

          # Run the migration inside the exact image we just built, so the
          # migration scripts match the application code.
          # --entrypoint: the Lambda base image's own entrypoint only accepts a
          # single handler name and rejects any other command.
          # "-e NAME" without a value forwards the variable from this step's
          # env, so the password never appears on the command line.
          # The three dummy values only satisfy app.core.config.Settings, which
          # has no defaults for them; migrations never use them.
          docker run --rm \
            --entrypoint alembic \
            -e APP_ENV="$ENV_PREFIX" \
            -e POSTGRES_HOST \
            -e POSTGRES_PORT \
            -e POSTGRES_USER \
            -e POSTGRES_PASSWORD \
            -e POSTGRES_DB \
            -e INTERNAL_API_KEY=unused-by-migrations \
            -e TELEGRAM_BOT_TOKEN=unused-by-migrations \
            -e JWT_SECRET=unused-by-migrations \
            "$IMAGE_URI" upgrade head

      - name: Update AWS Lambda Function Code
        run: |
          echo "Updating Lambda $LAMBDA_NAME with the new image..."
          aws lambda update-function-code \
            --function-name $LAMBDA_NAME \
            --image-uri $IMAGE_URI